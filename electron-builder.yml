appId: com.olaysco.spotify-miniplayer-pip
productName: Spotify MiniPlayer PiP
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - resources/**
asarUnpack:
  - resources/**
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
  icon: resources/icon.png
  category: public.app-category.music
  extendInfo:
    NSMicrophoneUsageDescription: Sing Mode listens to your voice to show your pitch and score your singing.
    NSAudioCaptureUsageDescription: Sing Mode captures system audio to compare your pitch with the song.
linux:
  target:
    - AppImage
  icon: resources/icon.png
  category: AudioVideo
